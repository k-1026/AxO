<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1300" viewBox="0 0 960 1300" role="img" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>계절 제품 개발 아이디어 에이전트 user flow</title>
<desc>BM이 계절을 고르고 후보 풀, 필수 통과 조건, 순위, 결과 화면, 상세 카드를 거쳐 회의 후보를 고르는 흐름과 예외 처리</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.ti{font-size:16px;font-weight:600}
.su{font-size:13px}
.lb{font-size:13px;font-weight:600;fill:#444441}
.must rect{fill:#E1F5EE;stroke:#0F6E56}
.must .ti{fill:#085041}.must .su{fill:#0F6E56}
.later rect{fill:#EEEDFE;stroke:#534AB7}
.later .ti{fill:#3C3489}.later .su{fill:#534AB7}
.side rect{fill:#FAEEDA;stroke:#854F0B}
.side .ti{fill:#633806}.side .su{fill:#854F0B}
.exc rect{fill:#F7F6F2;stroke:#888780;stroke-dasharray:5 4}
.exc .ti{fill:#444441;font-size:13px;font-weight:600}.exc .su{fill:#5F5E5A}
.neu rect{fill:#F1EFE8;stroke:#888780}
.neu .ti{fill:#2C2C2A}
.tag{font-size:11px;font-weight:600}
</style>
<rect x="0" y="0" width="960" height="1300" fill="#FFFFFF"/>

<text x="40" y="44" font-size="20" font-weight="700" fill="#2C2C2A">User flow · 계절 제품 개발 아이디어 에이전트</text>
<text x="40" y="66" class="su" fill="#5F5E5A">BM이 계절 하나를 고르고, 회의에 올릴 라인 후보를 고르기까지 (brand/spec/시나리오.md 12장 장면 1~9)</text>

<text x="480" y="98" text-anchor="middle" class="lb">메인 흐름</text>
<text x="810" y="98" text-anchor="middle" class="lb">예외 처리</text>

<g class="neu"><rect x="340" y="110" width="280" height="44" rx="22" stroke-width="1"/><text x="480" y="132" text-anchor="middle" dominant-baseline="central" class="ti">다음 시즌 라인 고민</text></g>
<line x1="480" y1="154" x2="480" y2="174" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="must"><rect x="340" y="176" width="280" height="64" rx="10" stroke-width="1"/><text x="480" y="198" text-anchor="middle" dominant-baseline="central" class="ti">계절 선택</text><text x="480" y="220" text-anchor="middle" dominant-baseline="central" class="su">봄 · 여름 · 가을 · 겨울</text><text x="606" y="191" text-anchor="end" class="tag" fill="#0F6E56">장면 1</text></g>
<line x1="480" y1="240" x2="480" y2="270" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="must"><rect x="340" y="272" width="280" height="64" rx="10" stroke-width="1"/><text x="480" y="294" text-anchor="middle" dominant-baseline="central" class="ti">기후 이슈 · 피부 고민</text><text x="480" y="316" text-anchor="middle" dominant-baseline="central" class="su">K4 수치 → 피부 목적 3~5개</text><text x="606" y="287" text-anchor="end" class="tag" fill="#0F6E56">장면 1</text></g>
<line x1="620" y1="304" x2="698" y2="304" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="exc"><rect x="700" y="276" width="220" height="56" rx="10" stroke-width="1"/><text x="810" y="295" text-anchor="middle" dominant-baseline="central" class="ti">정보 없음</text><text x="810" y="315" text-anchor="middle" dominant-baseline="central" class="su">수치 칸 '확인 필요'</text></g>
<line x1="480" y1="336" x2="480" y2="366" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="must"><rect x="340" y="368" width="280" height="64" rx="10" stroke-width="1"/><text x="480" y="390" text-anchor="middle" dominant-baseline="central" class="ti">후보 풀 생성</text><text x="480" y="412" text-anchor="middle" dominant-baseline="central" class="su">K3 원료 목적 ∩ K4 계절 목적</text><text x="606" y="383" text-anchor="end" class="tag" fill="#0F6E56">장면 2·3</text></g>
<line x1="620" y1="400" x2="698" y2="400" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="exc"><rect x="700" y="372" width="220" height="56" rx="10" stroke-width="1"/><text x="810" y="391" text-anchor="middle" dominant-baseline="central" class="ti">품절 (수급 미확인)</text><text x="810" y="411" text-anchor="middle" dominant-baseline="central" class="su">'공급사 수급 확인 필요'</text></g>
<line x1="480" y1="432" x2="480" y2="462" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<polygon points="480,464 600,506 480,548 360,506" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="480" y="498" text-anchor="middle" dominant-baseline="central" class="ti" fill="#2C2C2A">필수 통과 조건</text>
<text x="480" y="518" text-anchor="middle" dominant-baseline="central" class="su" fill="#5F5E5A">7개 검사</text>

<line x1="360" y1="506" x2="262" y2="506" stroke="#854F0B" stroke-width="1.4" marker-end="url(#a)"/>
<text x="311" y="494" text-anchor="middle" class="tag" fill="#854F0B">UNKNOWN</text>
<g class="side"><rect x="40" y="474" width="220" height="64" rx="10" stroke-width="1"/><text x="150" y="496" text-anchor="middle" dominant-baseline="central" class="ti">추가 검증 후보</text><text x="150" y="518" text-anchor="middle" dominant-baseline="central" class="su">순위와 따로 표시</text></g>
<path d="M150 538 L150 712 L338 712" fill="none" stroke="#854F0B" stroke-width="1.4" marker-end="url(#a)"/>

<line x1="600" y1="506" x2="698" y2="506" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<text x="649" y="494" text-anchor="middle" class="tag" fill="#888780">FAIL</text>
<g class="exc"><rect x="700" y="478" width="220" height="56" rx="10" stroke-width="1"/><text x="810" y="497" text-anchor="middle" dominant-baseline="central" class="ti">순위에서 제외</text><text x="810" y="517" text-anchor="middle" dominant-baseline="central" class="su">예: 길경 (클렌저용)</text></g>

<line x1="480" y1="548" x2="480" y2="586" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="490" y="570" class="tag" fill="#0F6E56">PASS</text>

<g class="must"><rect x="340" y="588" width="280" height="80" rx="10" stroke-width="1"/><text x="480" y="610" text-anchor="middle" dominant-baseline="central" class="ti">순위 매기기</text><text x="480" y="632" text-anchor="middle" dominant-baseline="central" class="su">6기준 가중치 (임시값)</text><text x="480" y="652" text-anchor="middle" dominant-baseline="central" class="su">근거 없는 기준은 빼고 환산</text><text x="606" y="603" text-anchor="end" class="tag" fill="#0F6E56">장면 6</text></g>
<line x1="480" y1="668" x2="480" y2="678" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="must"><rect x="340" y="680" width="280" height="80" rx="10" stroke-width="1"/><text x="480" y="702" text-anchor="middle" dominant-baseline="central" class="ti">결과 화면</text><text x="480" y="724" text-anchor="middle" dominant-baseline="central" class="su">상위 3개 카드 + 다른 후보</text><text x="480" y="744" text-anchor="middle" dominant-baseline="central" class="su">점수 · 이유 · 사진 자리</text><text x="606" y="695" text-anchor="end" class="tag" fill="#0F6E56">장면 6·8</text></g>
<line x1="620" y1="720" x2="698" y2="720" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="exc"><rect x="700" y="684" width="220" height="72" rx="10" stroke-width="1"/><text x="810" y="702" text-anchor="middle" dominant-baseline="central" class="ti">오늘 안 나옴</text><text x="810" y="722" text-anchor="middle" dominant-baseline="central" class="su">사진 → 프롬프트 표시</text><text x="810" y="740" text-anchor="middle" dominant-baseline="central" class="su">랭킹 → 마지막 수집 시점</text></g>
<line x1="480" y1="760" x2="480" y2="790" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="must"><rect x="340" y="792" width="280" height="64" rx="10" stroke-width="1"/><text x="480" y="814" text-anchor="middle" dominant-baseline="central" class="ti">상세 카드 열기</text><text x="480" y="836" text-anchor="middle" dominant-baseline="central" class="su">구성 · 가격 · 광고 표현 체크</text><text x="606" y="807" text-anchor="end" class="tag" fill="#0F6E56">장면 3·4·5</text></g>
<line x1="620" y1="824" x2="698" y2="824" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="exc"><rect x="700" y="796" width="220" height="56" rx="10" stroke-width="1"/><text x="810" y="815" text-anchor="middle" dominant-baseline="central" class="ti">정보 없음 (원가)</text><text x="810" y="835" text-anchor="middle" dominant-baseline="central" class="su">'원가 확인 필요'</text></g>
<line x1="480" y1="856" x2="480" y2="886" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<polygon points="480,888 600,930 480,972 360,930" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="480" y="930" text-anchor="middle" dominant-baseline="central" class="ti" fill="#2C2C2A">더 비교할까?</text>

<line x1="360" y1="930" x2="262" y2="930" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#at)"/>
<text x="311" y="918" text-anchor="middle" class="tag" fill="#0F6E56">다른 계절</text>
<g class="must"><rect x="40" y="898" width="220" height="64" rx="10" stroke-width="1"/><text x="150" y="920" text-anchor="middle" dominant-baseline="central" class="ti">다른 계절 비교</text><text x="150" y="942" text-anchor="middle" dominant-baseline="central" class="su">↻ 계절 선택으로</text></g>
<path d="M40 930 L20 930 L20 208 L338 208" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#at)"/>

<line x1="600" y1="930" x2="698" y2="930" stroke="#534AB7" stroke-width="1.4" marker-end="url(#ap)"/>
<text x="649" y="918" text-anchor="middle" class="tag" fill="#534AB7">기준 바꾸기</text>
<g class="later"><rect x="700" y="898" width="220" height="64" rx="10" stroke-width="1"/><text x="810" y="920" text-anchor="middle" dominant-baseline="central" class="ti">순위 기준 바꾸기</text><text x="810" y="942" text-anchor="middle" dominant-baseline="central" class="su">버튼 ★ / ★★ · 나중</text></g>
<path d="M920 930 L940 930 L940 628 L622 628" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ap)"/>
<text x="932" y="790" text-anchor="end" class="tag" fill="#534AB7">↻ 다시 계산</text>

<line x1="480" y1="972" x2="480" y2="1010" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="490" y="994" class="tag" fill="#5F5E5A">충분함</text>

<g class="must"><rect x="340" y="1012" width="280" height="52" rx="10" stroke-width="1"/><text x="480" y="1038" text-anchor="middle" dominant-baseline="central" class="ti">회의 후보 선택</text></g>
<line x1="480" y1="1064" x2="480" y2="1094" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="later"><rect x="340" y="1096" width="280" height="64" rx="10" stroke-width="1"/><text x="480" y="1118" text-anchor="middle" dominant-baseline="central" class="ti">개발 의뢰서 초안</text><text x="480" y="1140" text-anchor="middle" dominant-baseline="central" class="su">나중 · 양식 확인 필요</text><text x="606" y="1111" text-anchor="end" class="tag" fill="#534AB7">장면 9</text></g>
<line x1="620" y1="1128" x2="698" y2="1128" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<g class="exc"><rect x="700" y="1100" width="220" height="56" rx="10" stroke-width="1"/><text x="810" y="1119" text-anchor="middle" dominant-baseline="central" class="ti">정보 없음 (견적)</text><text x="810" y="1139" text-anchor="middle" dominant-baseline="central" class="su">'제조사 견적 확인 필요'</text></g>
<line x1="480" y1="1160" x2="480" y2="1190" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<g class="neu"><rect x="340" y="1192" width="280" height="44" rx="22" stroke-width="1"/><text x="480" y="1214" text-anchor="middle" dominant-baseline="central" class="ti">회의 · 제조사 협의로</text></g>

<g transform="translate(40,1264)">
<rect x="0" y="-10" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="26" y="0" dominant-baseline="central" class="su" fill="#444441">필수 (첫 버전)</text>
<rect x="150" y="-10" width="18" height="18" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="176" y="0" dominant-baseline="central" class="su" fill="#444441">나중 (2차)</text>
<rect x="280" y="-10" width="18" height="18" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="306" y="0" dominant-baseline="central" class="su" fill="#444441">따로 보여 주는 목록</text>
<rect x="460" y="-10" width="18" height="18" rx="4" fill="#F7F6F2" stroke="#888780" stroke-dasharray="4 3"/><text x="486" y="0" dominant-baseline="central" class="su" fill="#444441">예외 처리 (정보 없음 · 오늘 안 나옴 · 품절)</text>
</g>
</svg>
