<div class="topbar"><div class="in">
  <button class="brand" type="button" data-view="home">기획실</button>
  <nav class="menu" aria-label="메뉴">
    <button type="button" data-view="launch">출시 기획실</button>
    <button type="button" data-view="pricing">요금제</button>
    <button type="button" data-view="my">마이 기획실</button>
  </nav>
  <button class="ai-chat-btn" id="ai-chat-open" type="button" aria-label="AI Chat 열기"><span class="spark" aria-hidden="true">✦</span><span class="label">AI Chat</span></button>
  <div class="auth" id="auth" aria-label="로그인"></div>
</div></div>

<!-- 첫 화면: 입장 팝업 -->
<section class="view view-home" id="view-home" data-view-panel="home">
  <div class="enter-card" role="group" aria-labelledby="enter-title">
    <h2 id="enter-title">기획실에 입장하시겠습니까?</h2>
    <p>계절별 트렌드와 한방 약재로 만든<br>라인 후보로 기획안을 만들어 보세요!</p>
    <button class="enter-yes" type="button" data-view="launch">네</button>
  </div>
</section>

<!-- 출시 기획실 -->
<section class="view view-launch" id="view-launch" data-view-panel="launch" hidden>
  <div class="hero"><div class="in">
    <div class="seasons" role="tablist" aria-label="계절 선택" id="seasons"></div>
  </div></div>
  <div class="season-info" id="season-info" hidden>
    <div class="hero hero-info"><div class="in">
      <h1 id="title"></h1>
      <div class="issues" id="issues"></div>
      <aside class="trend-assist" aria-labelledby="trend-assist-title">
        <span class="trend-avatar" aria-hidden="true">↗</span>
        <div class="trend-bubble" aria-live="polite" aria-atomic="true">
          <div class="trend-meta"><strong id="trend-assist-title">실시간 뷰티 트렌드는?</strong><span class="trend-status" id="trend-status"></span><button type="button" class="trend-refresh" id="beauty-refresh" title="트렌드 수집 파일을 다시 불러와요">↻ 새로고침</button></div>
          <p class="trend-line" id="trend-line"></p>
          <p class="trend-plan" id="trend-plan"></p>
          <small class="trend-source" id="trend-source"></small><details class="trend-details"><summary>근거 보기</summary><div class="trend-evidence" id="trend-evidence"></div></details>
        </div>
      </aside>
    </div></div>
    <section class="main" aria-label="라인 후보">
      <div id="results"></div>
      <div class="result-actions"><button class="btn-line" type="button" data-action="reroll">재추천</button></div>
    </section>
  </div>
</section>

<!-- 요금제 -->
<section class="view view-pricing" id="view-pricing" data-view-panel="pricing" hidden>
  <div class="page">
    <table class="price-table">
      <thead><tr><th>상품 (안)</th><th>가격</th></tr></thead>
      <tbody>
        <tr><td>무료 체험</td><td>기획서 1건</td></tr>
        <tr><td>건당 이용권 (수정 5회)</td><td><b>₩14,900</b></td></tr>
        <tr class="pick"><td>월 구독 (5건, 초과 건당 ₩4,900)</td><td><b>₩29,000</b></td></tr>
      </tbody>
    </table>
  </div>
</section>

<!-- 마이 기획실 (8단계에서 채워요) -->
<section class="view view-my" id="view-my" data-view-panel="my" hidden>
  <div class="page"></div>
</section>

<dialog id="detail" aria-labelledby="d-name">
  <div class="detail">
    <div class="di">
      <div class="dh"><div><div class="herb" id="d-rank"></div><h2 id="d-name"></h2></div><button class="close" id="d-close" type="button">닫기</button></div>
      <dl id="d-facts"></dl>
      <div class="combo-box"><div class="sec">이 조합을 추천한 이유</div><dl class="kw" id="d-why-combo"></dl></div>
      <div class="persona-box"><div class="sec">이런 고객에게 권해 보세요</div><div class="persona-grid" id="d-persona"></div></div>
      <div><div class="sec">출시 구성 (예시)</div>
        <table><thead><tr><th>제품</th><th>용량</th><th>정가</th><th>ml당</th></tr></thead><tbody id="d-lineup"></tbody></table></div>
      <div class="detail-actions">
        <button class="btn-line" type="button" data-action="reroll">재추천</button>
        <button class="btn-solid" type="button" id="d-next">다음 단계</button>
      </div>
    </div>
  </div>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
