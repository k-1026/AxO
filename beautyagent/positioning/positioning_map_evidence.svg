<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>포지셔닝 맵 1: 이용 가능성 × 규제 근거</title>
<desc>가로축은 이용 가능성(사내 전용에서 누구나 가입), 세로축은 규제 근거(원료 규제·광고 표현 확인 없음에서 내장). 아모레퍼시픽 LEMON은 사내 전용·규제 근거 높음, 매니패스트와 라우드랩스(색조 메이크업 상품 기획)는 누구나 가입·규제 근거 낮음, 우리 에이전트는 누구나 가입·규제 근거 내장 우상단.</desc>
<rect width="680" height="500" fill="#FFFFFF"/>
<rect x="350" y="40" width="270" height="200" fill="#FBEFF1" rx="4"/>
<text x="606" y="62" font-size="12" fill="#A3243B" text-anchor="end">비어 있는 자리</text>
<line x1="80" y1="240" x2="620" y2="240" stroke="#D9CEC4" stroke-width="1"/>
<line x1="350" y1="40" x2="350" y2="440" stroke="#D9CEC4" stroke-width="1"/>
<rect x="80" y="40" width="540" height="400" fill="none" stroke="#E8DED6" stroke-width="1" rx="4"/>
<text x="350" y="16" font-size="12" fill="#5A4E48" text-anchor="middle">원료 규제 · 광고 표현 확인을 스스로 반영</text>
<text x="350" y="32" font-size="14" font-weight="bold" fill="#2A2320" text-anchor="middle">규제 근거 내장</text>
<text x="350" y="462" font-size="14" font-weight="bold" fill="#2A2320" text-anchor="middle">규제 확인 없음</text>
<text x="350" y="478" font-size="12" fill="#5A4E48" text-anchor="middle">사용자가 직접 법규 확인</text>
<text x="72" y="236" font-size="14" font-weight="bold" fill="#2A2320" text-anchor="end">사내</text>
<text x="72" y="254" font-size="12" fill="#5A4E48" text-anchor="end">전용</text>
<text x="628" y="236" font-size="14" font-weight="bold" fill="#2A2320">누구나</text>
<text x="628" y="254" font-size="12" fill="#5A4E48">가입</text>
<circle cx="135" cy="85" r="11" fill="#EEE7E0" stroke="#5A4E48" stroke-width="1.5"/>
<text x="151" y="82" font-size="14" fill="#2A2320">아모레퍼시픽 LEMON</text>
<text x="151" y="98" font-size="12" fill="#5A4E48">사내 연구원 전용 · 연구자료·규제 검토</text>
<circle cx="565" cy="320" r="11" fill="#E4F1EC" stroke="#2F6B5E" stroke-width="1.5"/>
<text x="549" y="317" font-size="14" fill="#2A2320" text-anchor="end">라우드랩스 (콜마)</text>
<text x="549" y="333" font-size="12" fill="#5A4E48" text-anchor="end">무료 가입 · 색조 메이크업 상품 기획</text>
<text x="549" y="348" font-size="12" fill="#5A4E48" text-anchor="end">규제 확인: 공식 자료에 언급 없음</text>
<circle cx="565" cy="400" r="11" fill="#F6EBD2" stroke="#B88A2E" stroke-width="1.5"/>
<text x="549" y="397" font-size="14" fill="#2A2320" text-anchor="end">매니패스트</text>
<text x="549" y="413" font-size="12" fill="#5A4E48" text-anchor="end">누구나 가입 · 뷰티 규제 없음</text>
<circle cx="565" cy="120" r="13" fill="#F3D6DA" stroke="#A3243B" stroke-width="1.5"/>
<text x="547" y="116" font-size="14" font-weight="bold" fill="#7E1C2E" text-anchor="end">우리 에이전트</text>
<text x="547" y="132" font-size="12" fill="#A3243B" text-anchor="end">외부 판매 · 원료 후보표(K3) · 광고 표현 규칙(K6)</text>
</svg>
