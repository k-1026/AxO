<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>포지셔닝 맵 2: 산업 특화도 × 실행 연결도</title>
<desc>가로축은 산업 특화도(범용에서 뷰티 특화), 세로축은 실행 연결도(문서에서 끝남에서 광고 표현 검수와 OEM 연결까지). 범용 생성형 AI는 범용·문서에서 끝남, 매니패스트는 범용이지만 AI 코딩 도구로 이어져 중간 높이, 우리 에이전트는 뷰티 특화·실행 연결 우상단.</desc>
<rect width="680" height="500" fill="#FFFFFF"/>
<rect x="350" y="40" width="270" height="200" fill="#E1F5EE" rx="4"/>
<text x="606" y="62" font-size="12" fill="#0F6E56" text-anchor="end">비어 있는 자리</text>
<line x1="80" y1="240" x2="620" y2="240" stroke="#B4B2A9" stroke-width="1"/>
<line x1="350" y1="40" x2="350" y2="440" stroke="#B4B2A9" stroke-width="1"/>
<rect x="80" y="40" width="540" height="400" fill="none" stroke="#D3D1C7" stroke-width="1" rx="4"/>
<text x="350" y="16" font-size="12" fill="#5F5E5A" text-anchor="middle">광고 표현 검수 · OEM 연결까지</text>
<text x="350" y="32" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">실행 연결</text>
<text x="350" y="462" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">문서에서 끝남</text>
<text x="350" y="478" font-size="12" fill="#5F5E5A" text-anchor="middle">기획서 작성으로 종료</text>
<text x="72" y="236" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="end">범용</text>
<text x="72" y="254" font-size="12" fill="#5F5E5A" text-anchor="end">모든 산업</text>
<text x="628" y="236" font-size="14" font-weight="bold" fill="#2C2C2A">뷰티</text>
<text x="628" y="254" font-size="12" fill="#5F5E5A">특화</text>
<circle cx="190" cy="380" r="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="204" y="377" font-size="14" fill="#2C2C2A">범용 생성형 AI</text>
<text x="204" y="393" font-size="12" fill="#5F5E5A">ChatGPT·Claude 채팅</text>
<circle cx="160" cy="270" r="11" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="176" y="267" font-size="14" fill="#2C2C2A">매니패스트</text>
<text x="176" y="283" font-size="12" fill="#5F5E5A">기획서 → AI 코딩 도구</text>
<circle cx="540" cy="100" r="13" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<text x="522" y="96" font-size="14" font-weight="bold" fill="#085041" text-anchor="end">우리 에이전트</text>
<text x="522" y="112" font-size="12" fill="#0F6E56" text-anchor="end">기획서 → 표현 검수 → OEM</text>
<line x1="175" y1="258" x2="522" y2="112" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
